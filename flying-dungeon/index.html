<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saborosa — Flying Dungeon</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { display: block; position: absolute; top: 50%; left: 50%;
          transform: translate(-50%, -50%); background: #000; }
  #bar  { position: absolute; left: 0; top: 0; height: 4px; width: 0;
          background: #f2d94c; transition: width .1s; z-index: 2; }
  #help { position: absolute; left: 14px; bottom: 12px; z-index: 2;
          color: #cfe; opacity: .7; font: 12px/1.4 monospace;
          text-shadow: 0 1px 3px #000; }
  #controls { position: absolute; right: 14px; bottom: 12px; z-index: 3;
              background: rgba(0,0,0,.5); padding: 7px 11px; border-radius: 4px;
              color: #cfe; font: 12px/1.4 monospace; }
  #controls label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  /* Typed number, not a slider: these are values you want to set exactly and
     read back, and a slider gives you neither. */
  #controls input[type=number] { width: 52px; background: #0f1730; color: #e6f4ff;
              border: 1px solid #3a4a6a; font: 12px monospace; padding: 1px 3px;
              text-align: right; }
  #controls hr { border: 0; border-top: 1px solid #ffffff22; margin: 5px 0; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="bar"></div>
  <div id="help">arrows / WASD to fly &middot; hold SPACE to fire &middot; 1 to switch pilot &middot; hold C for hitboxes</div>
  <div id="controls">
    <label><input type="checkbox" id="ballistic" checked> ballistic corpse (arc)</label>
    <label><input type="checkbox" id="stepped" checked> stepped plane (low fps)</label>
    <label>plane fps <input type="range" id="steppedFps" min="4" max="30" step="1"><span id="steppedFpsVal"></span></label>
    <label><input type="checkbox" id="film" checked> old-film style</label>
    <hr>
    <label>rewind per clock hit
      <input type="number" id="coinRewind" min="0" max="60" step="0.5"> s</label>
  </div>

  <!--
    Load order matters (plain globals, like the main Saborosa game).

    Written out by script rather than as plain tags so each file can carry a
    cache-busting ?v=. Twice now a change has landed in the source and dist and
    STILL thrown "x is not a function" in the browser, because it was running a
    cached copy of a file whose URL had not changed — which looks exactly like a
    bug in the new code and wastes a debugging session proving it isn't.

    The whole of src/ is 184KB against ~30MB of art, so never caching it costs
    nothing; the assets, which are the expensive part, cache exactly as before.

    `async = false` is what preserves execution ORDER for scripts inserted this
    way — without it these would run in whatever order they finish downloading,
    and the globals would not be defined when game.js goes looking for them.
  -->
  <script>
  (function () {
    var files = [
      'config', 'assets', 'input', 'tray-background', 'fruit-select', 'liftoff',
      'intro', 'plane', 'fly', 'coin', 'boss', 'film', 'game-clock', 'hud',
      'game-over',
      'game',
    ];
    var v = Date.now();
    for (var i = 0; i < files.length; i++) {
      var s = document.createElement('script');
      s.src = 'src/' + files[i] + '.js?v=' + v;
      s.async = false;             // keep load order — see above
      document.head.appendChild(s);
    }
  })();
  </script>
</body>
</html>
